<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ralph Kitchen</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ralph Kitchen">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F6F6F4; --surface:#FFFFFF; --ink:#1D1D1F; --muted:#6B6B70; --line:#E3E3E0; --soft:#EEEEEB;
  --herb:#2B59C3; --herb-ink:#FFFFFF; --saffron:#A86B00; --chili:#C0392B;
  --btn:#1D1D1F; --btn-ink:#FFFFFF;
  --b1:#C98A12; --b2:#3E7C4F; --b3:#7A4E8C; --b4:#2F74B5; --b5:#C8453A; --b6:#1F8A87;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141416; --surface:#1E1E21; --ink:#EDEDEF; --muted:#A0A0A6; --line:#2E2E33; --soft:#27272B;
    --herb:#7FA2FF; --herb-ink:#10182E; --saffron:#E6B04A; --chili:#F07A6A; --btn:#EDEDEF; --btn-ink:#141416; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141416; --surface:#1E1E21; --ink:#EDEDEF; --muted:#A0A0A6; --line:#2E2E33; --soft:#27272B;
  --herb:#7FA2FF; --herb-ink:#10182E; --saffron:#E6B04A; --chili:#F07A6A; --btn:#EDEDEF; --btn-ink:#141416; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--b4);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 6px}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
header.top .sync{font-size:13px;color:var(--muted)}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.lede{color:var(--muted);margin:2px 0 18px;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:0 auto}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--herb);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:700;cursor:pointer;min-height:46px;text-decoration:none}
.btn.primary{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--chili);border-color:color-mix(in srgb,var(--chili) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.full{width:100%}
.section{margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section h2{font-size:19px;font-weight:700}
.section .count{color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,40,30,.12)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.soon{background:color-mix(in srgb,var(--saffron) 18%,transparent);color:var(--saffron);font-weight:700}
.tag.gone{background:color-mix(in srgb,var(--chili) 16%,transparent);color:var(--chili);font-weight:700}
.tag.low{background:color-mix(in srgb,var(--b4) 16%,transparent);color:var(--b4)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:16px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:19px;margin-bottom:4px}
label.f{display:block;margin:12px 0 0;font-weight:700;font-size:14px}
label.f span{display:block;margin-bottom:5px}
input[type=text],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.hint{font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--herb);border-color:var(--herb);color:var(--herb-ink);font-weight:700}
.stepper{display:flex;gap:8px}
.stepper button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-size:22px;font-weight:700;cursor:pointer}
.stepper button[aria-pressed="true"]{border-color:var(--herb);background:color-mix(in srgb,var(--herb) 12%,var(--surface));color:var(--herb)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--herb)}
/* bowls: the signature */
.bowl{--c:var(--b1);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:800 13px/1 var(--display);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.bowl.sm{width:20px;height:20px;font-size:11px}
.bowl.lg{width:44px;height:44px;font-size:20px}
.bowl[data-n="1"]{--c:var(--b1)}.bowl[data-n="2"]{--c:var(--b2)}.bowl[data-n="3"]{--c:var(--b3)}
.bowl[data-n="4"]{--c:var(--b4)}.bowl[data-n="5"]{--c:var(--b5)}.bowl[data-n="6"]{--c:var(--b6)}
.bowls-row{display:flex;gap:4px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.recipe.done{opacity:.62}
.recipe h3{font-size:21px;font-weight:700;margin:10px 0 4px;letter-spacing:-.01em}
.recipe .blurb{color:var(--muted);font-size:15px;margin:0 0 10px}
.recipe .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.recipe .uses{font-size:14px;margin:0 0 12px}
.recipe .uses b{color:var(--herb)}
.recipe .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font-size:13px;font-weight:700;color:var(--saffron)}
.heart{background:none;border:0;padding:6px;cursor:pointer;color:var(--muted)}
.heart[aria-pressed="true"]{color:var(--chili)}
.heart svg{width:22px;height:22px}
.progress{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:color-mix(in srgb,var(--herb) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--herb) 30%,var(--line));margin-bottom:12px}
.progress .bowls-row .bowl{animation:bob 1.2s ease-in-out infinite}
.progress .bowls-row .bowl:nth-child(2){animation-delay:.15s}.progress .bowls-row .bowl:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){.progress .bowls-row .bowl{animation:none}}
.progress .msg{flex:1;font-weight:700}
/* shopping */
.shop-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.shop-row:first-child{border-top:0}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.tick[aria-pressed="true"]{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.tick svg{width:18px;height:18px}
.shop-row.got .name{text-decoration:line-through;color:var(--muted)}
.aisle{font:700 15px var(--display);margin:18px 0 6px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--herb);border-radius:99px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line)}
.sheet-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
.sheet-body{padding-top:14px;padding-bottom:40px}
/* cook view */
.cook h2.title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
.cook .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.cook .facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cook .facts b{display:block;font:800 20px var(--display)}
.cook .facts span{font-size:13px;color:var(--muted)}
.cook h3{font-size:20px;margin:26px 0 10px}
.ing{display:grid;grid-template-columns:20px 84px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums}
.ing .st{font-size:12px;color:var(--muted)}
.bowl-card{display:flex;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.bowl-card h4{margin:2px 0 4px;font:700 17px var(--display)}
.bowl-card ul{margin:0;padding-left:18px}
.bowl-card .note{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li::before{content:counter(s);font:800 20px/1.2 var(--display);color:var(--herb)}
ol.steps li.done{color:var(--muted)}
ol.steps li.done .t{text-decoration:line-through}
ol.steps .bw{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap}
ol.steps .mins{font-size:13px;color:var(--muted)}
.note-box{background:var(--surface);border-left:4px solid var(--b2);border-radius:8px;padding:12px 14px;margin-top:10px}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.optPick{display:flex;gap:12px;text-align:left;width:100%;background:none;border:0;padding:14px 14px 8px;cursor:pointer}
.optFoot{display:flex;justify-content:flex-end;padding:0 8px 8px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.store{display:grid;gap:10px;margin-top:6px}
.store div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.store b{display:block;font:700 15px var(--display);margin-bottom:2px}
.warn{background:color-mix(in srgb,var(--chili) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--chili) 35%,var(--line));color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.opt.on{border-color:var(--herb);background:color-mix(in srgb,var(--herb) 8%,var(--surface))}
.optTick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px}
.opt.on .optTick{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.optTick svg{width:16px;height:16px}
.optMain{display:flex;flex-direction:column;gap:3px;min-width:0}
.optTitle{font:700 18px/1.2 var(--display)}
.optBlurb{font-size:15px;color:var(--muted)}
.optMain .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.optMain .uses{font-size:14px}.optMain .uses b{color:var(--herb)}
.pickbar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 6px 20px rgba(20,40,30,.14);z-index:5}
.pickbar .n{flex:1}
.scan-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.scan-item.off{opacity:.5}
.scan-top{display:flex;gap:10px;align-items:center}
.scan-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.scan-fields input[type=date]{grid-column:1/-1}
.rate{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.rate[aria-pressed="true"][data-v="up"]{border-color:var(--herb);color:var(--herb);background:color-mix(in srgb,var(--herb) 10%,var(--surface))}
.rate[aria-pressed="true"][data-v="down"]{border-color:var(--chili);color:var(--chili);background:color-mix(in srgb,var(--chili) 10%,var(--surface))}
.learn-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.learn-row:first-child{border-top:0}
.learn-row .main{flex:1;min-width:0}
.x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
/* v6 neutral overrides */
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.tick[aria-pressed="true"],.opt.on .optTick,.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.stepper button[aria-pressed="true"]{border-color:var(--btn);background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--btn)}
.opt.on{border-color:var(--btn);background:var(--surface);box-shadow:inset 0 0 0 1px var(--btn)}
.progress{background:var(--surface);border-color:var(--line)}
.bar i{background:var(--ink)}
ol.steps li::before{color:var(--muted)}
.recipe .uses b,.optMain .uses b{color:var(--ink)}
.check input,.usedChk{accent-color:var(--btn)}
nav.tabs{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
nav.tabs button{position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:10px 4px 12px;font-size:12.5px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
nav.tabs button *{pointer-events:none}
.recipe{padding:0;overflow:hidden}
.rtop{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 16px 10px;cursor:pointer;color:inherit}
.rtop h3{margin:6px 0 8px}
.ract{display:flex;align-items:center;gap:6px;padding:0 10px 10px 16px;border-top:0}
.ract .sp{flex:1}
.banner{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.banner .main{flex:1}
.qty{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:15px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.muted{color:var(--muted)}
.mt{margin-top:14px}
.hr{height:1px;background:var(--line);margin:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Ralph Kitchen</h1><span class="sync" id="sync">This device</span></header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysUntil(iso){ if(!iso) return null; const a = new Date(iso+'T00:00:00'), b = new Date(todayISO()+'T00:00:00'); if(isNaN(a)) return null; return Math.round((a-b)/86400000); }
function dateTag(iso, est){
  const d = daysUntil(iso); if(d === null) return '';
  const t = est ? '~' : '';
  const dt = new Date(iso+'T00:00:00');
  if(d < 0) return `<span class="tag gone">Past use-by</span>`;
  if(d === 0) return `<span class="tag gone">Use today</span>`;
  if(d === 1) return `<span class="tag soon">Use by tomorrow</span>`;
  if(d <= 3) return `<span class="tag soon">Use by ${t}${dt.toLocaleDateString(undefined,{weekday:'short'})}</span>`;
  return `<span class="tag">Use by ${t}${dt.toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span>`;
}
const norm = s => String(s||'').toLowerCase().replace(/\(.*?\)/g,'').split(',')[0].replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().replace(/(es|s)$/,'');
function sameThing(a, b){ a = norm(a); b = norm(b); if(a.length < 3 || b.length < 3) return a === b; return a === b || a.includes(b) || b.includes(a); }
function bannedIn(names){
  const A = (S.taste && S.taste.avoid) || [];
  return A.filter(a => names.some(n => { const x = norm(n), y = norm(a); return y.length >= 3 && (x === y || (' '+x+' ').includes(' '+y+' ') || (' '+x+' ').includes(' '+y)); }));
}
const money = v => { const n = +v; if(!n) return ''; return (S.settings.currency || '$') + (n >= 100 ? Math.round(n) : n.toFixed(n % 1 ? 2 : 0)); };
function costTag(v){
  const n = +v; if(!n) return '';
  const over = n > (+S.settings.budget || 0) && +S.settings.budget > 0;
  return `<span class="tag ${over?'soon':''}">~${money(n)}${over?' (over budget)':''}</span>`;
}
let toastT;

const DEFAULT_MODEL = 'claude-sonnet-5', DEFAULT_QUICK = 'claude-haiku-4-5-20251001';
const API = {
  key(){ try{ return localStorage.getItem('rk:apikey') || ''; }catch(e){ return ''; } },
  model(){ try{ return localStorage.getItem('rk:model') || DEFAULT_MODEL; }catch(e){ return DEFAULT_MODEL; } },
  quick(){ try{ return localStorage.getItem('rk:quick') || DEFAULT_QUICK; }catch(e){ return DEFAULT_QUICK; } },
  async call(prompt, {images, signal, quick, max} = {}){
    const content = [];
    for(const b of (images || [])){
      const type = ['image/jpeg','image/png','image/webp','image/gif'].includes(b.type) ? b.type : 'image/jpeg';
      content.push({type:'image', source:{type:'base64', media_type:type, data: await b64(b)}});
    }
    content.push({type:'text', text: prompt});
    let res;
    try{
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', signal,
        headers:{'content-type':'application/json','x-api-key':API.key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({model: quick ? API.quick() : API.model(), max_tokens: max || 8000, messages:[{role:'user', content}]})
      });
    }catch(e){ throw {code: e && e.name === 'AbortError' ? 'cancelled' : 'network'}; }
    if(!res.ok){
      let msg = ''; try{ const j = await res.json(); msg = (j.error && j.error.message) || ''; }catch(e){}
      const code = res.status === 401 ? 'bad_key' : res.status === 429 ? 'rate_limited' : (res.status === 529 || res.status >= 500) ? 'overloaded'
        : /credit|billing/i.test(msg) ? 'no_credit' : /model/i.test(msg) ? 'bad_model' : 'api_error';
      throw {code, message: msg};
    }
    const data = await res.json();
    if(data.stop_reason === 'max_tokens') throw {code:'invalid_json'};

  }
};

  if(u === 'oz') return n >= 16 ? r(n/16)+' lb' : r(n)+' oz';
  if(!u) return String(r(n));
  const pl = n > 1 ? (/(ch|sh|x|s)$/.test(u) ? u+'es' : u+'s') : u;
  return r(n)+' '+pl;
}
function totalText(e){
  const sums = new Map(), loose = [];
  for(const p of e.parts){
    const q = (p.buyQty && +p.buyQty) ? {n:+p.buyQty, u:(UNIT[p.buyUnit]||[sing(String(p.buyUnit||'').toLowerCase())])[0], f:(UNIT[p.buyUnit]||[0,1])[1]} : null;
    const pq = q ? {n:q.n*(q.f||1), u:q.u} : parseQty(p.qty);
    if(pq){ sums.set(pq.u, (sums.get(pq.u)||0) + pq.n); }
    else if(p.qty && !loose.includes(p.qty)) loose.push(String(p.qty).split(',')[0].trim());
  }
  const out = [...sums].map(([u,n]) => fmtQty(n,u)).concat(loose);
  return out.join(' + ');
}
function shopName(n){ const s = String(n).split(',')[0].split('(')[0].trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
function partsText(e){ return e.parts.map(p => (p.qty ? p.qty + ' ' : '') + (e.parts.length>1 || p.recipe==='Added by you' ? `(${p.recipe})` : '')).join(', ').trim(); }
function viewShop(){

    }).join('')}</div>`;
  }
  if(check.length){
    h += `<div class="section"><h2>Check you have</h2><span class="count">${check.length}</span></div><p class="hint" style="margin-top:0">You probably have these. Some may need a top-up.</p><div class="list">${check.map(e =>

const RATE_CHIPS = ['Loved it','Too spicy','Not spicy enough','Too bland','Took too long','Too fiddly','Portions too small','Great for lunch','Reheated badly'];
const LOC_FOR = a => ({'Meat':'Fridge','Dairy & eggs':'Fridge','Produce':'Fridge','Frozen':'Freezer'})[a] || 'Cupboard';
function stockEntry(e, haveIt){
  const sh = S.plan.shopping;
  if(sh.stocked[e.key]) return;
  const existing = S.pantry.items.find(p => sameThing(p.name, e.name));

  const item = {id:newId(), name:shopName(e.name), qty: haveIt ? '' : totalText(e), loc:LOC_FOR(e.aisle), useBy:'', low:false, added:todayISO()};
  S.pantry.items.push(item); sh.stocked[e.key] = item.id;

function unstock(k){
  const sh = S.plan.shopping, id = sh.stocked[k];
  if(id && id !== true && id !== 'existing') S.pantry.items = S.pantry.items.filter(p => p.id !== id);
  delete sh.stocked[k];
}
function usePlan(r){
  // For each kitchen item this recipe uses: remove it, or leave the remainder when there's clearly some left.
  const plan = new Map();
  for(const i of (r.ingredients||[])){
    if(i.status === 'staple') continue;
    const p = S.pantry.items.find(x => sameThing(x.name, i.name)); if(!p) continue;
    const need = (i.buyQty && UNIT[i.buyUnit]) ? {n:i.buyQty*UNIT[i.buyUnit][1], u:UNIT[i.buyUnit][0]} : parseQty(i.qty);
    const cur = plan.get(p.id) || {p, need:null, bad:false};
    if(need && (!cur.need || cur.need.u === need.u)) cur.need = {n:(cur.need ? cur.need.n : 0) + need.n, u:need.u}; else if(!need) cur.bad = true;
    plan.set(p.id, cur);
  }
  return [...plan.values()].map(({p, need, bad}) => {
    const have = parseQty(p.qty);
    if(!bad && need && have && have.u === need.u && have.n > need.n * 1.1){
      return {p, action:'reduce', left: fmtQty(have.n - need.n, have.u)};
    }
    return {p, action:'remove', unsure: !have};
  });
}

async function toJpeg(file){
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.85));
  }catch(e){ return file; }
}

    const data = await SAMPLE.json(buildPrompt([{title:text, requested:true}], S.plan.notes), {signal: ui.genCtl.signal, cache:false});
    const list = Array.isArray(data) ? data : (data && data.recipes) || [data && data.recipe || data];
    const r = cleanRecipe(list[0] || {});
    if(!r.ingredients.length) throw {code:'invalid_json'};
    if(!S.plan.created) S.plan.created = new Date().toISOString();
    S.plan.recipes.push(r); S.library.recent = [r.title, ...S.library.recent].slice(0, 30);
    save('plan'); save('library'); toast(`Added ${r.title} to this week.`);
  }catch(e){ if(!(e && e.code === 'cancelled')) toast(errCopy(e)); }
  finally{ ui.gen = null; ui.genCtl = null; render(); }
}
async function buildOne(o, notes, others, signal){
  let lastErr;
  for(let attempt = 0; attempt < 2; attempt++){
    try{
      const data = await SAMPLE.json(buildPrompt([o], notes, others), {signal, cache:false});
      const list = Array.isArray(data) ? data : (data && data.recipes) || [data && data.recipe || data];
      const r = cleanRecipe(list[0] || {});
      if(!r.ingredients.length) throw {code:'invalid_json'};
      return r;
    }catch(e){
      lastErr = e;
      if(e && ['cancelled','not_granted','session_expired','sampling_disabled'].includes(e.code)) throw e;
      await new Promise(res => setTimeout(res, 1500 + Math.random()*1500));
    }
  }
  throw lastErr;
}
async function buildWeek(){
  const d = S.plan.draft; if(!d || !SAMPLE) return;
  const chosen = d.options.filter(o => d.picked.includes(o.id)); if(!chosen.length) return;
  const n = chosen.length, append = !!d.append;
  ui.genCtl = new AbortController();
  ui.gen = {type:'build', msg:`Writing recipe 1 of ${n}\u2026`, count:0};
  render(); window.scrollTo(0,0);
  const results = new Array(n), failed = []; let done = 0, next = 0, fatal = null;
  const titles = chosen.map(o => o.title);
  const worker = async () => {
    while(next < n && !fatal){
      const i = next++;
      try{ results[i] = await buildOne(chosen[i], d.notes, titles.filter((_,k) => k !== i), ui.genCtl.signal); }
      catch(e){ if(e && ['cancelled','not_granted','session_expired','sampling_disabled'].includes(e.code)) fatal = e; else failed.push({o:chosen[i], e}); }
      done++;
      const m = $('#genMsg'); if(m && done < n) m.textContent = `Writing recipe ${done+1} of ${n}\u2026`;
    }
  };
  await Promise.all([worker(), worker()]);
  const recipes = results.filter(Boolean);
  try{
    if(fatal && !recipes.length) throw fatal;
    if(!recipes.length) throw (failed[0] && failed[0].e) || {code:'invalid_json'};
    const passed = append ? [] : d.options.filter(o => !d.picked.includes(o.id)).map(o => o.title);
    S.taste.passed = [...passed, ...S.taste.passed].slice(0, 40);
    const left = failed.map(f => f.o);
    const draft = left.length ? {options:left, picked:left.map(o => o.id), notes:d.notes, append:true} : null;
    if(append) { S.plan.recipes.push(...recipes); S.plan.draft = draft; }
    else S.plan = fill('plan', {recipes, created: new Date().toISOString(), notes: d.notes, draft});
    S.library.recent = [...recipes.map(r => r.title), ...S.library.recent].slice(0, 30);
    save('plan'); save('library'); save('taste');
    ui.weekNotes = ''; ui.viewDraft = false;
    toast(left.length ? `Built ${recipes.length} of ${n}. Tap Continue to try the rest again.` : recipes.length === 1 ? 'Your recipe is ready.' : `Your ${recipes.length} recipes are ready.`);
  }catch(e){ if(!(e && e.code === 'cancelled')) toast(errCopy(e)); }
  finally{ ui.gen = null; ui.genCtl = null; render(); }
}
async function swap(id){
  const r = S.plan.recipes.find(x => x.id === id); if(!r || !SAMPLE) return;
  ui.swapping = id; render();
  try{
    const data = await SAMPLE.json(swapPrompt(r), {cache:false});
    const nr = cleanRecipe((data && data.recipe) || data);
    if(!nr.ingredients.length) throw {code:'invalid_json'};
    const idx = S.plan.recipes.findIndex(x => x.id === id);
    if(idx >= 0){ S.plan.recipes[idx] = nr; delete S.plan.cooked[id]; }
    S.library.recent = [nr.title, ...S.library.recent].slice(0, 30);
    S.taste.passed = [r.title, ...S.taste.passed].slice(0, 40);
    save('plan'); save('library'); save('taste'); toast('Swapped in ' + nr.title + '.');
  }catch(e){ toast(errCopy(e)); }
  finally{ ui.swapping = null; render(); }
}
async function parseBulk(){
  const text = ($('#bulk').value || '').trim(); if(!text) return;
  const btn = $('#bulkBtn'); btn.disabled = true; btn.textContent = 'Sorting your list\u2026';
  let items = null;
  if(SAMPLE){
    try{
      const wk = new Date().toLocaleDateString('en-GB',{weekday:'long'});
      const out = await SAMPLE.json(`Today is ${todayISO()} (${wk}). Turn this kitchen list into items. Reply with only a JSON array like [{"name":"chicken thighs","qty":"1kg","loc":"Fridge","useBy":"2026-09-25"}]. loc is Fridge, Freezer or Cupboard (guess sensibly from the item). useBy is YYYY-MM-DD, or null when no date or shelf-life is given; resolve words like "Friday" or "2 days" relative to today. Keep names short and plain, lowercase except proper nouns. qty is "" if not given.\n\nList:\n${text}`, {modelTier:'quick', cache:false});
      if(Array.isArray(out)) items = out;
    }catch(e){ if(e && e.code !== 'invalid_json') toast(errCopy(e)); }
  }
  if(!items) items = text.split('\n').map(s => s.trim()).filter(Boolean).map(name => ({name, qty:'', loc:'Cupboard', useBy:null}));
  const clean = items.filter(i => i && i.name).map(i => ({id:newId(), name:String(i.name), qty:String(i.qty||''), loc:['Fridge','Freezer','Cupboard'].includes(i.loc)?i.loc:'Cupboard', useBy:/^\d{4}-\d{2}-\d{2}$/.test(i.useBy||'')?i.useBy:'', low:false, added:todayISO()}));
  S.pantry.items.push(...clean); save('pantry');
  closeSheet(); render(); toast(`Added ${clean.length} ${clean.length===1?'item':'items'}. Tap any to fix details.`);
}

/* ---------- PDF ---------- */
function pdfReady(){ return !!(DL && window.jspdf && window.jspdf.jsPDF); }
const BOWL_RGB = [[201,138,18],[62,124,79],[122,78,140],[47,116,181],[200,69,58],[31,138,135]];
function pdfClean(s){
  return String(s ?? '').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...')
    .replace(/\u2153/g,'1/3').replace(/\u2154/g,'2/3').replace(/\u215b/g,'1/8').replace(/\u2192/g,'->').replace(/\u2022/g,'-').replace(/[^\u0000-\u00ff]/g,'');
}
function pdfBowl(pdf, x, y, n, r){
  const c = BOWL_RGB[((n-1)%6+6)%6]; pdf.setFillColor(c[0],c[1],c[2]); pdf.circle(x, y, r, 'F');
  pdf.setTextColor(255,255,255); pdf.setFont('helvetica','bold'); pdf.setFontSize(r*3.2); pdf.text(String(n), x, y + r*0.38, {align:'center'});
  pdf.setTextColor(23,37,29);
}
function pdfRecipe(pdf, r, first){
  if(!first) pdf.addPage();
  const M = 16, W = 210 - 2*M, BOT = 297 - M; let y = M + 4;
  const ensure = h => { if(y + h > BOT){ pdf.addPage(); y = M + 4; } };
  const heading = t => { ensure(16); y += 5; pdf.setFont('helvetica','bold'); pdf.setFontSize(13); pdf.setTextColor(47,107,69); pdf.text(t, M, y); y += 2; pdf.setDrawColor(216,224,214); pdf.line(M, y, M+W, y); y += 6; pdf.setTextColor(23,37,29); };
  pdf.setTextColor(23,37,29);
  if(r.kind){ pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(185,127,15); pdf.text(pdfClean(r.kind), M, y); y += 6; pdf.setTextColor(23,37,29); }
  pdf.setFont('helvetica','bold'); pdf.setFontSize(21);
  const tl = pdf.splitTextToSize(pdfClean(r.title), W); pdf.text(tl, M, y + 3); y += tl.length * 8.5 + 1;
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5); pdf.setTextColor(86,103,92);
  const meta = pdf.splitTextToSize(pdfClean(`Makes ${r.serves} portions   |   Prep ${r.prepMins} min   |   Cook ${r.cookMins} min${r.cost&&r.cost.total?'   |   About '+money(r.cost.total):''}${(r.equipment||[]).length?'   |   '+r.equipment.join(', '):''}`), W);
  pdf.text(meta, M, y); y += meta.length * 5 + 1;
  if(r.blurb){ pdf.setFont('helvetica','italic'); const b = pdf.splitTextToSize(pdfClean(r.blurb), W); pdf.text(b, M, y); y += b.length*5; }
  pdf.setTextColor(23,37,29);

  heading('Ingredients');
  const colW = W/2 - 4, ings = r.ingredients || [];
  for(let k = 0; k < ings.length; k += 2){
    let rowH = 0;
    [ings[k], ings[k+1]].forEach((i, c) => {
      if(!i) return;
      pdf.setFontSize(10.5);
      const nl = pdf.splitTextToSize(pdfClean(i.name), colW - 30);
      rowH = Math.max(rowH, nl.length * 4.8 + 2.2);
    });
    ensure(rowH);
    [ings[k], ings[k+1]].forEach((i, c) => {
      if(!i) return;
      const x = M + c * (W/2 + 4);
      if(i.bowl) pdfBowl(pdf, x + 2.2, y - 1.3, i.bowl, 2.2);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.text(pdfClean(i.qty), x + 6.5, y);
      pdf.setFont('helvetica','normal'); pdf.text(pdf.splitTextToSize(pdfClean(i.name), colW - 30), x + 29, y);
    });
    y += rowH;
  }

  heading('Prep your bowls');
  (r.prepSteps||[]).forEach((t, k) => {
    pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5);
    const l = pdf.splitTextToSize(pdfClean(t), W - 8); ensure(l.length*4.8 + 2);
    pdf.setFont('helvetica','bold'); pdf.text(`${k+1}.`, M, y); pdf.setFont('helvetica','normal'); pdf.text(l, M + 8, y); y += l.length*4.8 + 2;
  });
  if((r.prepSteps||[]).length) y += 2;
  (r.bowls||[]).forEach(b => {
    pdf.setFontSize(10.5);
    const items = pdf.splitTextToSize(pdfClean((b.items||[]).join('; ')), W - 14);
    const note = b.note ? pdf.splitTextToSize(pdfClean(b.note), W - 14) : [];
    const h = 5.5 + items.length*4.8 + note.length*4.6 + 3;
    ensure(h);
    pdfBowl(pdf, M + 4.5, y + 0.5, b.n, 4.5);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(11.5); pdf.text(pdfClean(`Bowl ${b.n}: ${b.label}`), M + 13, y + 1.5);
    let yy = y + 6.5; pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5); pdf.text(items, M + 13, yy); yy += items.length*4.8;
    if(note.length){ pdf.setFont('helvetica','italic'); pdf.setTextColor(86,103,92); pdf.text(note, M + 13, yy); pdf.setTextColor(23,37,29); yy += note.length*4.6; }
    y = Math.max(yy, y + 10) + 3;
  });

  heading('Cook');
  (r.method||[]).forEach((m, k) => {
    pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5);
    const txt = pdfClean(m.text + (m.mins ? `  (${m.mins} min)` : ''));
    const l = pdf.splitTextToSize(txt, W - 16);
    const bw = m.bowls || [];
    const h = Math.max(l.length*4.8, bw.length ? 4 + bw.length*5.2 : 0) + 3;
    ensure(h);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(12); pdf.setTextColor(47,107,69); pdf.text(String(k+1), M, y); pdf.setTextColor(23,37,29);
    bw.forEach((n, j) => pdfBowl(pdf, M + 11, y - 1.3 + j*5.2, n, 2.3));
    pdf.setFont('helvetica','normal'); pdf.setFontSize(10.5); pdf.text(l, M + 16, y);
    y += h;
  });
  const st = r.storage;
  const notes = st ? [[st.freezes?'Store (freezes well)':'Store (fridge only, eat next day)', st.fridge], ['Freezing', st.freezes?st.freeze:''], ['Reheating', st.reheat], ['Bring it back to life', st.revive], ['Veg', r.veg]] : [['Lunch portions', r.lunch], ['Veg', r.veg]];
  if(st) heading('Store and reheat');
  notes.forEach(([t, v]) => {
    if(!v) return;
    pdf.setFontSize(10.5); const l = pdf.splitTextToSize(pdfClean(v), W - 6); ensure(l.length*4.8 + 9); y += 3;
    pdf.setFont('helvetica','bold'); pdf.text(t, M, y); y += 5; pdf.setFont('helvetica','normal'); pdf.text(l, M, y); y += l.length*4.8;
  });
}
function pdfShopping(pdf){
  pdf.addPage();
  const M = 16, BOT = 297 - M; let y = M + 6;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(20); pdf.setTextColor(23,37,29); pdf.text('Shopping list', M, y); y += 9;
  const list = shoppingList().filter(e => e.kind === 'buy');
  for(const a of AISLES){
    const rows = list.filter(e => e.aisle === a); if(!rows.length) continue;
    if(y + 14 > BOT){ pdf.addPage(); y = M + 6; }
    pdf.setFontSize(12); pdf.setTextColor(47,107,69); pdf.text(a, M, y); y += 6; pdf.setTextColor(23,37,29);
    for(const e of rows){
      if(y + 7 > BOT){ pdf.addPage(); y = M + 6; }
      pdf.setDrawColor(150,160,150); pdf.rect(M, y - 3.5, 4, 4);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.text(pdfClean(shopName(e.name)), M + 7, y);
      pdf.setFont('helvetica','normal'); pdf.setTextColor(86,103,92); pdf.text(pdfClean(totalText(e)), M + 85, y); pdf.setTextColor(23,37,29);
      y += 6.5;
    }
    y += 2;
  }
}
async function savePdf(pdf, name){
  try{ await DL.save({filename: name, data: pdf.output('blob')}); }
  catch(e){ if(!(e && e.code === 'declined')) toast('Couldn\u2019t save the PDF here.'); }
}
function pdfOne(id, lib){

      S.taste.liked = S.taste.liked.slice(0, 40); S.taste.disliked = S.taste.disliked.slice(0, 40); save('taste');
      if(rt.v === 'up' && !S.library.recipes.some(x => x.title === r.title)){ const c = clone(r); c.id = newId(); S.library.recipes.unshift(c); while(JSON.stringify(S.library).length > 220000) S.library.recipes.pop(); save('library'); }
    }
    ui.rating = null; closeSheet(); render(); if(rt.v) toast(rt.v === 'up' ? 'Noted, and saved to your recipes.' : 'Noted. Claude will steer away from it.');
  },
  save: t => {
    const r = S.plan.recipes.find(x => x.id === t.dataset.id); if(!r) return;
    const idx = S.library.recipes.findIndex(x => x.title === r.title);
    if(idx >= 0){ S.library.recipes.splice(idx, 1); toast('Removed from saved.'); }
    else {
      const copy = clone(r); copy.id = newId(); S.library.recipes.unshift(copy);
      while(JSON.stringify(S.library).length > 220000) S.library.recipes.pop();
      toast('Saved. Find it under Saved recipes.');
    }
    save('library'); render();
  },
  library: () => sheetLibrary(),
  addLib: t => {
    const src = S.library.recipes.find(x => x.id === t.dataset.id); if(!src) return;
    const r = clone(src); r.id = newId();
    r.ingredients.forEach(i => { if(i.status !== 'staple') i.status = S.pantry.items.some(p => sameThing(p.name, i.name)) ? 'have' : 'buy'; });
    if(!S.plan.created) S.plan.created = new Date().toISOString();
    S.plan.recipes.push(r); save('plan'); closeSheet(); ui.tab = 'week'; render(); toast('Added ' + r.title + ' to this week.');
  },
  step: t => { const o = openSteps[t.dataset.r] || (openSteps[t.dataset.r] = {}); o[t.dataset.s] = !o[t.dataset.s]; t.classList.toggle('done', o[t.dataset.s]); },
  pdfOne: t => pdfOne(t.dataset.id, !!t.dataset.lib),
  pdfWeek: () => pdfWeek(),
  tick: t => {
    const k = t.dataset.k, sh = S.plan.shopping, e = shoppingList().find(x => x.key === k);
    if(sh.checked[k]){ delete sh.checked[k]; unstock(k); }
    else { sh.checked[k] = true; if(e) stockEntry(e, false); }
    save('plan'); save('pantry'); render();
  },
  have: t => {
    const k = t.dataset.k, sh = S.plan.shopping, e = shoppingList().find(x => x.key === k);
    if(sh.checked[k]) unstock(k);
    sh.have[k] = true; delete sh.toBuy[k]; delete sh.checked[k];
    if(e) stockEntry(e, true);
    save('plan'); save('pantry'); render();
  },
  undoHave: t => { const k = t.dataset.k; delete S.plan.shopping.have[k]; unstock(k); save('plan'); save('pantry'); render(); },
  toBuy: t => { S.plan.shopping.toBuy[t.dataset.k] = true; save('plan'); render(); },
  addExtra: () => {
    const name = $('#extraName').value.trim(); if(!name){ $('#extraName').focus(); return; }
    S.plan.shopping.extras.push({id:newId(), name, qty:$('#extraQty').value.trim()}); save('plan'); render();
  },
  rmExtra: t => { const id = t.dataset.k.slice(2); S.plan.shopping.extras = S.plan.shopping.extras.filter(x => x.id !== id); delete S.plan.shopping.checked[t.dataset.k]; save('plan'); render(); },
  stock: () => {
    const sh = S.plan.shopping; const locFor = a => ({'Meat':'Fridge','Dairy & eggs':'Fridge','Produce':'Fridge','Frozen':'Freezer'})[a] || 'Cupboard';
    const rows = shoppingList().filter(e => e.kind === 'buy' && sh.checked[e.key] && !sh.stocked[e.key]);
    rows.forEach(e => { S.pantry.items.push({id:newId(), name:e.name, qty:totalText(e), name:shopName(e.name), loc:locFor(e.aisle), useBy:'', low:false, added:todayISO()}); sh.stocked[e.key] = true; });
    save('pantry'); save('plan'); render(); toast(`Put ${rows.length} ${rows.length===1?'item':'items'} in the kitchen. Add use-by dates there.`);
  },
  set: t => { const k = t.dataset.k; S.settings[k] = k === 'region' ? t.dataset.v : +t.dataset.v; save('settings'); render(); },
  equip: t => { const v = t.dataset.v, e = S.settings.equipment; const i = e.indexOf(v); if(i >= 0) e.splice(i,1); else e.push(v); save('settings'); render(); }
};
function removeItem(id, action){
  const i = S.pantry.items.find(x => x.id === id); if(!i) return;
  S.pantry.items = S.pantry.items.filter(x => x.id !== id);
  S.pantry.log.unshift({name:i.name, action, date:todayISO()}); S.pantry.log = S.pantry.log.slice(0, 200);
  save('pantry'); closeSheet(); render(); toast(action === 'binned' ? `Binned ${i.name}.` : `Used up ${i.name}.`);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  if(t.tagName === 'LABEL') return;
  const f = ACT[t.dataset.act]; if(f){ if(t.tagName !== 'LI') e.preventDefault(); f(t, e); }
});
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.field;
  if(f){ S.settings[f] = f === 'budget' ? (parseFloat(e.target.value) || 0) : e.target.value; save('settings'); }
  if(e.target.id === 'scanFiles') runScan(e.target.files);
  const lk = e.target.dataset && e.target.dataset.local;
  if(lk){ const v = e.target.value.trim(); try{ if(v) localStorage.setItem('rk:'+lk, v); else localStorage.removeItem('rk:'+lk); }catch(err){} }
  if(e.target.id === 'importFile' && e.target.files[0]){
    const f = e.target.files[0]; e.target.value = '';
    f.text().then(txt => {
      let j; try{ j = JSON.parse(txt); }catch(err){ toast('That file isn\u2019t a Ralph Kitchen backup.'); return; }
      const d = j.data || j; const ks = KEYS.filter(k => d[k] && typeof d[k] === 'object');
      if(!ks.length){ toast('That file isn\u2019t a Ralph Kitchen backup.'); return; }
      if(!confirm('Replace what\u2019s in the app with this backup?')) return;
      ks.forEach(k => { S[k] = fill(k, d[k]); save(k); });
      render(); toast('Backup loaded.');
    });
  }
  const sk = e.target.dataset && e.target.dataset.scan;
  if(sk !== undefined && ui.scan) ui.scan.items[+sk][e.target.dataset.f] = e.target.value;
});
document.addEventListener('input', e => { if(e.target.id === 'weekNotes') ui.weekNotes = e.target.value; if(e.target.id === 'reqs') ui.requests = e.target.value; const sk = e.target.dataset && e.target.dataset.scan; if(sk !== undefined && ui.scan) ui.scan.items[+sk][e.target.dataset.f] = e.target.value; });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- boot ---------- */
let samplesChecked = false;
function initApi(){ SAMPLE = API.key() ? SAMPLE_API : null; DL = DL_LOCAL; ui.scanOk = !!SAMPLE; ui.scanMax = 10; }
initApi(); samplesChecked = true;
if(!API.key()){ ui.tab = 'setup'; }
render();
</script>
</body>
